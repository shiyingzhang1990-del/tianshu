<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天书系统 - 中文顶刊语言润色</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>天 书</h1>
      <p class="subtitle">《管理世界》《经济研究》融合型中文顶刊语言润色系统</p>
      <p class="brand">壬镜科技出品 · siyee1@163.com</p>
    </header>

    <div class="container">
      <!-- Controls -->
      <div class="controls-row">
        <div class="control-group">
          <label>文本类型</label>
          <select v-model="textType">
            <option v-for="t in textTypes" :key="t.value" :value="t.value">{{ t.label }}</option>
          </select>
        </div>
        <div style="flex:1;min-width:0;"></div>
        <div class="style-modes">
          <button v-for="m in styleModes" :key="m.value"
                  class="style-mode-btn"
                  :class="{ active: styleMode === m.value }"
                  @click="styleMode = m.value">
            <span class="btn-title">{{ m.label }}</span>
            <span class="btn-desc">{{ m.desc }}</span>
          </button>
        </div>
      </div>

      <!-- Input Card -->
      <div class="input-card">
        <textarea v-model="textInput"
                  placeholder="请粘贴需要润色的学术文本...&#10;&#10;支持：摘要、引言、文献综述、理论分析、假设推导、研究设计、结果分析、机制检验、进一步研究、案例分析、讨论、结论、政策启示、完整论文"
                  :disabled="polishing"></textarea>
        <div class="input-footer">
          <span class="char-count" :class="{ warn: charCount > 12000, over: charCount > 15000 }">
            {{ charCount }} / 15000 字符
          </span>
          <div class="action-btns">
            <button class="btn-secondary" @click="clearAll" :disabled="polishing || (!textInput && !resultText)">清空</button>
            <button class="btn-primary" @click="startPolish" :disabled="polishing || !textInput.trim() || charCount > 15000">
              <span class="spinner" v-if="polishing"></span>
              {{ polishing ? '润色中...' : '开始润色' }}
            </button>
          </div>
        </div>
      </div>

      <!-- Loading during polish -->
      <div class="result-section" v-if="polishing && !resultText">
        <div class="result-card">
          <div class="result-loading">
            <div class="dots"><span></span><span></span><span></span></div>
            <p>AI正在分析文本结构、诊断逻辑问题、重构论证层次...</p>
            <p style="font-size:12px;color:#9ca3af;margin-top:4px;">这可能需要30-60秒，请耐心等待</p>
          </div>
        </div>
      </div>

      <!-- Result -->
      <div class="result-section" v-if="resultText">
        <div class="result-card">
          <div class="result-header">
            <h2>润色结果</h2>
            <div class="action-btns">
              <button class="btn-secondary" @click="copyResult">复制</button>
              <button class="btn-secondary" @click="downloadResult">下载 TXT</button>
            </div>
          </div>
          <div class="result-body" v-html="renderMarkdown(resultText)"></div>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <p>天书系统 · 壬镜科技出品 · siyee1@163.com</p>
      <p>AI润色结果仅供参考，重要论文请结合专业编辑意见使用</p>
    </footer>
  </div>

  <script src="/config.js"></script>
  <script src="/assets/vue.global.prod.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
